<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — MX Agents</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --fg: #1b1a17;
    --muted: #5e5a53;
    --line: #e3dfd6;
    --link: #0b57d0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --fg: #f4f1ea;
      --muted: #b8b3a9;
      --line: #2e2c27;
      --link: #9ec1ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
    line-height: 1.55;
  }
  main { max-width: 38rem; margin: 0 auto; padding: 8vh 1.25rem 3rem; }
  nav { font-size: 0.95rem; margin-bottom: 2.5rem; color: var(--muted); }
  h1 { margin: 0 0 1.5rem; font-size: clamp(2rem, 6vw, 2.6rem); font-weight: 500; letter-spacing: -0.02em; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { padding: 1rem 0; border-bottom: 1px solid var(--line); }
  .title { font-size: 1.2rem; }
  .date { color: var(--muted); font-size: 0.9rem; margin: 0.15rem 0 0.35rem; }
  .summary { margin: 0; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <nav><a href="/">MX Agents</a></nav>
  <h1>Blog</h1>
  <ul>
    <li>
      <a class="title" href="ca2-one-crystal-form/">1,178 crystals of one enzyme</a>
      <p class="date">October 2026</p>
      <p class="summary">What a whole crystal form of carbonic anhydrase II says about how the enzyme varies between crystals, and which tempting patterns turned out to be artefacts.</p>
    </li>
  </ul>
</main>
</body>
</html>
