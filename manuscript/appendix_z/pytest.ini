[pytest]
markers =
    zcheck: Appendix Z computational check
    slow: long-running benchmark or large-data check
    needs_pdb: requires data/pdb_cells.duckdb or analysis/data/pdb_roots.npz
    needs_xfel: requires data/blac_new_v0_nomulti.stream
    symbolic: requires sympy
testpaths = .
pythonpath = ../../agentsg/src
addopts = -q
