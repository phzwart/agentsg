[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sellingproofs"
version = "1.0.0"
description = "Machine-checked proofs and recomputed numbers of 'The Selling closure' (Acta Cryst. A)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "P. H. Zwart", email = "phzwart@lbl.gov" }]
requires-python = ">=3.10"
# agentsg is the library of the same repository: install it first with `pip install -e .`
# from the repository root, so that the claims run against the deposited commit.
dependencies = ["agentsg==0.5.0", "numpy>=1.26", "scipy>=1.11", "pytest>=7"]

[project.optional-dependencies]
pdb = ["duckdb"]
symbolic = ["sympy"]
plot = ["matplotlib"]

[project.scripts]
sellingproofs = "sellingproofs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
